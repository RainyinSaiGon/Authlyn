# Limit Flyway to V1-V3 in H2-backed tests (V4+ requires PostgreSQL + pgvector extension)
spring.flyway.target=3
# Prevent Spring AI from failing to start due to missing API key in H2 tests
spring.ai.openai.api-key=test-key-not-real
spring.ai.vectorstore.pgvector.initialize-schema=false
# Tests run without a configured JWT key; allow a random per-process signing key
authlyn.jwt.allow-ephemeral-key=true
# Knowledge indexing needs pgvector tables (V4), which H2 tests do not have
authlyn.chatbot.index-on-startup=false
